name: Test

# Runs the tests on every pull request, so a PR shows a green check (or a red
# X) before it's merged. The deploy (pages.yml) runs these same tests first,
# so the site only updates when they pass.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
