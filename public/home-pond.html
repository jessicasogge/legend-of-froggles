<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home Pond: The Legend of Mr. Froggles</title>
    <meta name="description" content="Mr. Froggles flies over the Home Pond, with lily pads, a pink water lily, cattails and tadpoles, where his legend begins." />
    <link rel="canonical" href="https://jessicasogge.github.io/legend-of-froggles/home-pond.html" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="pond">
    <main class="kingdom-screen">
      <a class="back" href="./next.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        Back
      </a>

      <h1>Home Pond</h1>

      <!-- The picture, and the card that covers it once everyone in the
           kingdom has been helped (game/quest-page.js). -->
      <div class="scene-box">
        <!-- The Home Pond, drawn big, with Mr. Froggles flying over the water.
             Same marker style as the kingdom picture on the previous screen.
             On small or short screens the edges are trimmed (slice), keeping
             Mr. Froggles and the middle of the pond in view.
             It's a group, not one image, so screen readers can reach Pebble,
             Wiggles and Bumble. Each of their quests has its own group
             (data-quest). -->
        <svg class="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMax slice" role="group" aria-label="Mr. Froggles flying over the Home Pond, with lily pads, cattails and a tadpole, a little snail stuck on a rock in the water, a little tadpole by a lily pad, and a bee by a water lily that hasn't opened">
          <rect width="1200" height="700" fill="#D9F2FF" />
          <!-- Pebble's quest. It holds the picture behind everyone too. -->
          <g data-quest="pebble" data-froggles-to="700 300" data-enchant-at="600 650">
            <g stroke="#1F1A24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
              <!-- Sun -->
              <circle cx="160" cy="110" r="56" fill="#FFD23F" />
              <path d="M160 30 V14 M160 190 V206 M80 110 H64 M240 110 H256 M104 54 l-12 -12 M216 54 l12 -12 M104 166 l-12 12 M216 166 l12 12" fill="none" stroke-width="7" />
              <!-- Little cloud -->
              <path d="M760 120 a30 30 0 0 1 50 -22 a40 40 0 0 1 72 10 a28 28 0 0 1 8 52 H770 a26 26 0 0 1 -10 -40 Z" fill="#FFFFFF" />

              <!-- Grass -->
              <path d="M0 700 V400 Q300 370 600 390 T1200 380 V700 Z" fill="#9BD67A" />
              <path d="M80 470 q14 -16 28 0 M1100 460 q14 -16 28 0 M150 640 q14 -16 28 0 M1060 650 q14 -16 28 0" fill="none" stroke="#6FAE52" stroke-width="7" />

              <!-- The pond -->
              <ellipse cx="610" cy="560" rx="470" ry="130" fill="#4FA3E0" />
              <path d="M300 560 q30 -12 60 0 M760 620 q30 -12 60 0 M880 520 q24 -10 48 0 M250 620 q24 -10 48 0" fill="none" stroke="#FFFFFF" stroke-width="7" />

              <!-- Lily pads, each with a notch -->
              <path d="M850 630 a70 32 0 1 0 22 -32 L850 630 Z" fill="#2E9E5B" />
              <path d="M800 540 a62 28 0 1 1 -18 -28 L800 540 Z" fill="#2E9E5B" />

              <!-- Tadpoles -->
              <circle cx="950" cy="550" r="10" fill="#1F1A24" stroke="none" />
              <path d="M960 554 q16 8 32 -2" fill="none" stroke-width="6" />

              <!-- Cattails -->
              <path d="M930 460 V250 M970 470 V290 M1010 450 V270" fill="none" stroke="#3B6E2A" />
              <rect x="914" y="240" width="32" height="80" rx="16" fill="#8A5A3B" />
              <rect x="954" y="280" width="32" height="74" rx="16" fill="#8A5A3B" />
              <rect x="994" y="260" width="32" height="78" rx="16" fill="#8A5A3B" />

              <!-- Rock at the water's edge -->
              <path d="M150 520 Q170 470 230 470 Q290 470 300 520 Z" fill="#B7B0C4" />

              <!-- Enchantment trail behind Mr. Froggles -->
              <path d="M60 380 C110 320 160 380 210 320 C250 280 270 270 300 260" fill="none" stroke="#5B2A9E" stroke-width="7" />
              <path d="M90 300 C140 250 180 290 230 230" fill="none" stroke="#5B2A9E" stroke-width="7" />
              <circle cx="60" cy="300" r="7" fill="#5B2A9E" stroke="none" />
              <circle cx="270" cy="360" r="7" fill="#5B2A9E" stroke="none" />
            </g>

            <!-- Pebble's little rock, out in the water. Once it's enchanted it's
                 gone, and a lily pad is in its place. -->
            <path class="pond-rock" d="M524 684 Q532 628 600 624 Q668 624 676 684 Z" fill="#B7B0C4" stroke="#1F1A24" stroke-width="8" stroke-linejoin="round" />

            <path class="enchant-swirl fades" d="M600 540 C760 540 770 700 600 700 C440 700 430 560 580 560" fill="none" stroke="#5B2A9E" stroke-width="12" stroke-linecap="round" />

            <!-- The lily pad and Pebble float to shore together at the end. -->
            <g class="snail-raft">
              <g class="new-pad" stroke="#1F1A24" stroke-width="8" stroke-linejoin="round">
                <path d="M600 654 a100 36 0 1 0 32 -35 L600 654 Z" fill="#2E9E5B" />
              </g>

              <!-- Pebble the snail, who needs help. Works like a button
                   (quest-page.js). -->
              <g class="helper" role="button" tabindex="0" aria-label="Pebble the snail needs help. Tap to talk." transform="translate(598 596) scale(1.5)">
                <circle class="helper-ring" r="62" fill="none" stroke="none" stroke-width="4" />
                <g stroke="#1F1A24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M42 -22 L36 -46 M52 -22 L58 -44" fill="none" />
                  <circle cx="36" cy="-48" r="5" fill="#1F1A24" />
                  <circle cx="58" cy="-46" r="5" fill="#1F1A24" />
                  <path d="M-46 20 Q-48 6 -32 6 L28 6 Q36 -6 38 -18 Q48 -30 58 -18 Q62 4 46 20 Z" fill="#F4D9B0" />
                  <circle cx="-8" cy="-14" r="27" fill="#F2A65A" />
                  <path d="M-8 -14 m2 -20 a20 20 0 1 1 -20 22 a12 12 0 1 1 14 -12 a5 5 0 1 1 -4 5" fill="none" />
                </g>
                <circle cx="49" cy="-10" r="3" fill="#1F1A24" />
                <path d="M44 -2 q6 4 11 -1" fill="none" stroke="#1F1A24" stroke-width="2.5" stroke-linecap="round" />
                <g class="alert">
                  <circle cy="-82" r="17" fill="#FFFFFF" stroke="#1F1A24" stroke-width="4" />
                  <path d="M0 -92 V-80" stroke="#1F1A24" stroke-width="5" stroke-linecap="round" />
                  <circle cy="-72" r="2.8" fill="#1F1A24" />
                </g>
                <circle r="58" fill="transparent" />
              </g>
            </g>
          </g>

          <!-- Wiggles' quest: a little tadpole by a small lily pad, who wants to
               hop. Once he's enchanted, he grows legs, becomes a little frog,
               and hops up onto the pad. -->
          <g data-quest="wiggles" data-froggles-to="470 300" data-enchant-at="330 610">
            <path d="M430 641 a58 18 0 1 0 18 -16 L430 641 Z" fill="#2E9E5B" stroke="#1F1A24" stroke-width="7" stroke-linejoin="round" />

            <path class="enchant-swirl fades" d="M390 520 C520 520 530 702 390 702 C260 702 250 536 370 532" fill="none" stroke="#5B2A9E" stroke-width="12" stroke-linecap="round" />

            <!-- Wiggles, who needs help. Works like a button (quest-page.js).
                 He's drawn twice: as a tadpole, and as the little frog he
                 becomes, sitting on the pad. -->
            <g class="helper" role="button" tabindex="0" aria-label="Wiggles the tadpole needs help. Tap to talk." transform="translate(380 610) scale(1.5)">
              <circle class="helper-ring" cy="-6" r="56" fill="none" stroke="none" stroke-width="4" />
              <g class="tadpole">
                <path class="tadpole-tail" d="M-40 0 q-12 -12 -24 -2 q-10 8 -20 -4" fill="none" stroke="#1F1A24" stroke-width="7" stroke-linecap="round" />
                <ellipse cx="-24" cy="0" rx="20" ry="15" fill="#4E5D2F" stroke="#1F1A24" stroke-width="4" />
                <circle cx="-16" cy="-5" r="5" fill="#FFFFFF" />
                <circle cx="-15" cy="-5" r="2.4" fill="#1F1A24" />
                <path d="M-18 5 q4 3 8 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
              </g>
              <g class="froglet" stroke="#1F1A24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 14 q-10 6 -2 10 h10 M50 14 q10 6 2 10 h-10" fill="#2E9E5B" />
                <ellipse cx="35" cy="6" rx="20" ry="15" fill="#2E9E5B" />
                <circle cx="26" cy="-8" r="7" fill="#2E9E5B" />
                <circle cx="44" cy="-8" r="7" fill="#2E9E5B" />
                <circle cx="26" cy="-8" r="2.6" fill="#1F1A24" stroke="none" />
                <circle cx="44" cy="-8" r="2.6" fill="#1F1A24" stroke="none" />
                <path d="M28 6 q7 6 14 0" fill="none" stroke-width="2.5" />
              </g>
              <g class="alert">
                <circle cx="-22" cy="-56" r="17" fill="#FFFFFF" stroke="#1F1A24" stroke-width="4" />
                <path d="M-22 -66 V-54" stroke="#1F1A24" stroke-width="5" stroke-linecap="round" />
                <circle cx="-22" cy="-46" r="2.8" fill="#1F1A24" />
              </g>
              <circle cy="-6" r="52" fill="transparent" />
            </g>
          </g>

          <!-- Bumble's quest: a hungry bee by a water lily that's shut tight.
               Once it's enchanted, it blooms, and she lands in it for the
               nectar. -->
          <g data-quest="bumble" data-froggles-to="540 240" data-enchant-at="800 490">
            <g stroke="#1F1A24" stroke-width="8" stroke-linejoin="round">
              <path class="lily-bud" d="M800 522 C770 508 780 470 800 452 C820 470 830 508 800 522 Z" fill="#FF8FB1" />
              <g class="lily-bloom">
                <circle cx="780" cy="500" r="22" fill="#FF8FB1" />
                <circle cx="820" cy="500" r="22" fill="#FF8FB1" />
                <circle cx="800" cy="474" r="22" fill="#FF8FB1" />
                <circle cx="800" cy="498" r="14" fill="#FFD23F" />
              </g>
            </g>

            <path class="enchant-swirl fades" d="M800 400 C910 400 920 580 800 580 C690 580 680 416 780 412" fill="none" stroke="#5B2A9E" stroke-width="12" stroke-linecap="round" />

            <!-- The outer group flies her into the flower at the end. -->
            <g class="bee-flight">
              <!-- Bumble the bee, who needs help. Works like a button
                   (quest-page.js). -->
              <g class="helper" role="button" tabindex="0" aria-label="Bumble the bee needs help. Tap to talk." transform="translate(712 396) scale(1.5)">
                <circle class="helper-ring" cy="-4" r="46" fill="none" stroke="none" stroke-width="4" />
                <g class="bee-body" stroke="#1F1A24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                  <ellipse cx="-8" cy="-18" rx="11" ry="15" fill="#E6F7FF" transform="rotate(-20 -8 -18)" />
                  <ellipse cx="6" cy="-18" rx="11" ry="15" fill="#E6F7FF" transform="rotate(20 6 -18)" />
                  <path d="M-22 4 l-8 2 l8 3" fill="#1F1A24" />
                  <ellipse rx="22" ry="15" fill="#FFD23F" />
                  <path d="M-10 -14 q-4 14 0 28 M2 -15 q-4 15 0 30" fill="none" stroke-width="6" />
                  <circle cx="20" cy="-6" r="11" fill="#1F1A24" />
                  <path d="M22 -16 q2 -10 8 -12 M26 -14 q6 -6 12 -4" fill="none" stroke-width="2.5" />
                </g>
                <circle cx="24" cy="-8" r="3" fill="#FFFFFF" />
                <path d="M20 0 q4 3 8 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
                <g class="alert">
                  <circle cy="-62" r="17" fill="#FFFFFF" stroke="#1F1A24" stroke-width="4" />
                  <path d="M0 -72 V-60" stroke="#1F1A24" stroke-width="5" stroke-linecap="round" />
                  <circle cy="-52" r="2.8" fill="#1F1A24" />
                </g>
                <circle cy="-4" r="42" fill="transparent" />
              </g>
            </g>
          </g>

          <!-- Mr. Froggles, flying -->
          <!-- Once everyone is helped, he twirls and flies off. -->
          <g class="froggles-exit">
            <!-- The outer group swoops him over to cast each enchantment. -->
            <g class="froggles-swoop">
              <image class="froggles-flying" href="./mr-froggles.svg" x="330" y="60" width="250" height="325" />
            </g>
          </g>
        </svg>

        <section class="finale" role="dialog" aria-labelledby="finale-title" hidden>
          <div class="finale-card">
            <h2 id="finale-title">You did it!</h2>
            <p>Everyone in the Home Pond is happy again. Mr. Froggles has flown off to find more friends who need help.</p>
            <div class="finale-buttons">
              <a class="story-button finale-next" href="./next.html">Pick another kingdom</a>
              <button type="button" class="story-button finale-stay">Stay and look</button>
            </div>
          </div>
        </section>
      </div>

      <section class="story" aria-live="polite">
        <p class="story-speaker" hidden></p>
        <p class="story-text"></p>
        <button type="button" class="story-button enchant" hidden></button>
      </section>
    </main>

    <script type="module">
      import { start } from './game/pond-page.js';
      start(document);
    </script>
  </body>
</html>
