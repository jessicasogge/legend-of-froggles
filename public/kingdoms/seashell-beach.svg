<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140">
  <!-- Seashell Beach: the sea, the sand and a palm tree under the sun -->
  <g stroke="#1F1A24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="200" height="140" fill="#BFE6FF" stroke="none" />
    <!-- Sun -->
    <circle cx="166" cy="28" r="14" fill="#FFD23F" />
    <!-- The sea -->
    <path d="M0 60 H200 V98 Q150 90 100 96 T0 94 Z" fill="#4FA3E0" />
    <path d="M24 72 q8 -4 16 0 M120 70 q8 -4 16 0 M70 84 q8 -4 16 0" fill="none" stroke="#FFFFFF" stroke-width="3" />
    <!-- The sand -->
    <path d="M0 140 V94 Q50 86 100 96 T200 92 V140 Z" fill="#F6D8A0" />
    <!-- A palm tree -->
    <path d="M118 122 Q114 84 104 52 L110 51 Q122 84 126 122 Z" fill="#A9733F" stroke-width="3" />
    <path d="M107 51 q-26 -12 -46 4 q22 -4 46 -4 Z M107 51 q-10 -20 -34 -22 q20 8 34 22 Z M107 51 q14 -24 40 -20 q-24 6 -40 20 Z M107 51 q28 -4 40 12 q-20 -10 -40 -12 Z" fill="#3FA34D" stroke-width="3" />
    <!-- A sea turtle and a seashell -->
    <circle cx="62" cy="114" r="6" fill="#7CC36E" stroke-width="3" />
    <ellipse cx="48" cy="118" rx="13" ry="9" fill="#3E8E41" stroke-width="3" />
    <path d="M152 126 Q150 106 162 104 Q174 106 172 126 Z" fill="#FFE3EC" stroke-width="3" />
    <path d="M157 124 Q157 112 162 111 Q167 112 167 124" fill="none" stroke="#FF8FB1" stroke-width="2" />
  </g>
</svg>
