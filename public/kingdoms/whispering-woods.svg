<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140">
  <!-- Whispering Woods: round trees, a spotted mushroom and whisper swirls -->
  <g stroke="#1F1A24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="200" height="140" fill="#EAF6D8" stroke="none" />
    <path d="M0 112 Q60 104 110 110 T200 108 V140 H0 Z" fill="#7FB653" />
    <!-- Trees: trunk, then a round top -->
    <rect x="34" y="70" width="12" height="44" fill="#8A5A3B" />
    <circle cx="40" cy="56" r="28" fill="#3E8E41" />
    <rect x="148" y="66" width="12" height="46" fill="#8A5A3B" />
    <circle cx="154" cy="50" r="30" fill="#4FA34F" />
    <rect x="96" y="82" width="10" height="30" fill="#8A5A3B" />
    <circle cx="101" cy="70" r="20" fill="#2E7A3A" />
    <!-- Mushroom -->
    <rect x="120" y="104" width="10" height="16" rx="3" fill="#FFF4DD" />
    <path d="M110 106 Q125 84 140 106 Z" fill="#E5383B" />
    <circle cx="121" cy="98" r="2.5" fill="#FFFFFF" stroke="none" />
    <circle cx="130" cy="101" r="2" fill="#FFFFFF" stroke="none" />
    <!-- Whispers: little purple swirls in the air -->
    <path d="M66 30 q6 -8 12 0 q6 8 12 0" fill="none" stroke="#5B2A9E" stroke-width="3" />
    <path d="M106 22 q5 -6 10 0 q5 6 10 0" fill="none" stroke="#5B2A9E" stroke-width="3" />
    <path d="M70 92 q4 -5 8 0" fill="none" stroke="#5B2A9E" stroke-width="3" />
  </g>
</svg>
