<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whispering Woods: The Legend of Mr. Froggles</title>
    <meta name="description" content="Mr. Froggles flies to the Whispering Woods, a forest of round trees and spotted mushrooms where the air is full of whispers." />
    <link rel="canonical" href="https://jessicasogge.github.io/legend-of-froggles/whispering-woods.html" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="forest">
    <main class="kingdom-screen">
      <a class="back" href="./next.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        Back
      </a>

      <h1>Whispering Woods</h1>

      <!-- The Whispering Woods, drawn big, with Mr. Froggles flying between
           the trees. Same marker style as the kingdom picture on the previous
           screen. On small or short screens the edges are trimmed (slice),
           keeping Mr. Froggles and the middle trees in view. -->
      <svg class="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Mr. Froggles flying through the Whispering Woods, between round trees and spotted mushrooms, with whispers swirling in the air">
        <rect width="1200" height="700" fill="#EAF6D8" />
        <g stroke="#1F1A24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
          <!-- Far trees, small and pale -->
          <rect x="1088" y="290" width="20" height="130" fill="#A9825F" />
          <circle cx="1098" cy="258" r="62" fill="#8CC97A" />

          <!-- Ground -->
          <path d="M0 700 V470 Q200 420 420 450 T840 440 T1200 460 V700 Z" fill="#7FB653" />
          <path d="M120 540 q16 -18 32 0 M560 600 q16 -18 32 0 M980 560 q16 -18 32 0" fill="none" stroke="#5E9440" stroke-width="7" />

          <!-- Big trees: trunk, then a round top -->
          <rect x="90" y="250" width="56" height="280" fill="#8A5A3B" />
          <circle cx="118" cy="190" r="140" fill="#3E8E41" />
          <path d="M70 170 q20 -20 40 0 M130 240 q20 -20 40 0" fill="none" stroke="#2E7A3A" stroke-width="7" />

          <rect x="842" y="260" width="56" height="260" fill="#8A5A3B" />
          <circle cx="870" cy="200" r="130" fill="#4FA34F" />
          <path d="M820 180 q20 -20 40 0 M880 250 q20 -20 40 0" fill="none" stroke="#3E8E41" stroke-width="7" />

          <rect x="680" y="330" width="40" height="190" fill="#8A5A3B" />
          <circle cx="700" cy="290" r="80" fill="#2E7A3A" />

          <!-- Spotted mushrooms -->
          <rect x="690" y="520" width="34" height="62" rx="10" fill="#FFF4DD" />
          <path d="M650 530 Q707 450 764 530 Z" fill="#E5383B" />
          <circle cx="690" cy="508" r="8" fill="#FFFFFF" stroke="none" />
          <circle cx="722" cy="492" r="7" fill="#FFFFFF" stroke="none" />
          <circle cx="740" cy="516" r="6" fill="#FFFFFF" stroke="none" />

          <rect x="988" y="560" width="26" height="46" rx="8" fill="#FFF4DD" />
          <path d="M958 568 Q1001 508 1044 568 Z" fill="#E5383B" />
          <circle cx="990" cy="552" r="6" fill="#FFFFFF" stroke="none" />
          <circle cx="1014" cy="545" r="5" fill="#FFFFFF" stroke="none" />

          <rect x="250" y="590" width="22" height="38" rx="7" fill="#FFF4DD" />
          <path d="M226 596 Q261 546 296 596 Z" fill="#E5383B" />
          <circle cx="258" cy="580" r="5" fill="#FFFFFF" stroke="none" />

          <!-- Little flowers in the grass -->
          <circle cx="410" cy="620" r="12" fill="#FFD23F" />
          <circle cx="820" cy="630" r="12" fill="#FF8FB1" />
          <circle cx="1120" cy="610" r="12" fill="#FFD23F" />

          <!-- Whispers: purple swirls drifting through the air -->
          <g fill="none" stroke="#5B2A9E" stroke-width="7">
            <path d="M300 90 q18 -24 36 0 q18 24 36 0 q18 -24 36 0" />
            <path d="M640 70 q14 -18 28 0 q14 18 28 0" />
            <path d="M640 150 q14 -18 28 0 q14 18 28 0 q14 -18 28 0" />
            <path d="M1000 380 q12 -16 24 0 q12 16 24 0" />
            <path d="M250 420 q12 -16 24 0 q12 16 24 0" />
          </g>
        </g>
        <!-- Mr. Froggles, flying -->
        <image class="froggles-flying" href="./mr-froggles.svg" x="330" y="90" width="250" height="325" />
      </svg>
    </main>
  </body>
</html>
