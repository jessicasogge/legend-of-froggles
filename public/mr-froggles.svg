<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title">
  <title id="title">Mr. Froggles, a smiling green frog with bowtie wings</title>
  <!-- Drawn from the original marker picture: two bump eyes, a big open
       smile, a long oval body and bowtie-shaped wings. -->
  <!-- The little purple squiggle above his head -->
  <path d="M78 14 q5 -9 10 0 q5 9 10 0 q5 -9 10 0 q5 9 10 0" fill="none" stroke="#5B2A9E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Wings: two triangles meeting in the middle, like a bowtie -->
  <path d="M28 108 L100 168 L28 228 Z" fill="#1F8A4C" stroke="#1A1A1A" stroke-width="5" stroke-linejoin="round" />
  <path d="M172 108 L100 168 L172 228 Z" fill="#1F8A4C" stroke="#1A1A1A" stroke-width="5" stroke-linejoin="round" />
  <path d="M28 108 L172 228 M172 108 L28 228" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" />
  <!-- Body -->
  <ellipse cx="100" cy="168" rx="30" ry="66" fill="#1F8A4C" stroke="#145A33" stroke-width="5" />
  <ellipse cx="100" cy="166" rx="16" ry="50" fill="none" stroke="#145A33" stroke-width="3" />
  <ellipse cx="100" cy="166" rx="6" ry="34" fill="#3FA06A" />
  <!-- Head and eye bumps -->
  <circle cx="76" cy="46" r="15" fill="#1F8A4C" stroke="#145A33" stroke-width="4" />
  <circle cx="124" cy="46" r="15" fill="#1F8A4C" stroke="#145A33" stroke-width="4" />
  <rect x="60" y="44" width="80" height="66" rx="30" fill="#1F8A4C" stroke="#145A33" stroke-width="4" />
  <rect x="66" y="50" width="68" height="20" fill="#1F8A4C" />
  <!-- Eyes and nose dots -->
  <circle cx="76" cy="44" r="5" fill="#1A1A1A" />
  <circle cx="124" cy="44" r="5" fill="#1A1A1A" />
  <circle cx="88" cy="68" r="4" fill="#1A1A1A" />
  <circle cx="110" cy="68" r="4" fill="#1A1A1A" />
  <!-- Smile -->
  <path d="M86 82 Q100 80 114 82 Q112 102 100 102 Q88 102 86 82 Z" fill="#5A2E1E" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round" />
</svg>
