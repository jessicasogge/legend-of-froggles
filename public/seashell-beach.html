<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seashell Beach: The Legend of Mr. Froggles</title>
    <meta name="description" content="Mr. Froggles flies to Seashell Beach, a sunny beach with a palm tree, to help a baby sea turtle, a dolphin and a hermit crab." />
    <link rel="canonical" href="https://jessicasogge.github.io/legend-of-froggles/seashell-beach.html" />
    <!-- How the link looks when it's shared (iMessage, Slack, Discord, social media) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Legend of Mr. Froggles" />
    <meta property="og:title" content="Seashell Beach: The Legend of Mr. Froggles" />
    <meta property="og:description" content="Mr. Froggles flies to Seashell Beach, a sunny beach with a palm tree, to help a baby sea turtle, a dolphin and a hermit crab." />
    <meta property="og:url" content="https://jessicasogge.github.io/legend-of-froggles/seashell-beach.html" />
    <meta property="og:image" content="https://jessicasogge.github.io/legend-of-froggles/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mr. Froggles, a smiling green frog with bowtie wings, beside the words The Legend of Mr. Froggles and a picture of each of the four kingdoms." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- The picture and name when the game is saved to an iPhone or iPad home screen -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Mr. Froggles" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="beach">
    <main class="kingdom-screen">
      <a class="back" href="./next.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        <span class="back-label">Back</span>
      </a>

      <h1>Seashell Beach</h1>

      <!-- The picture, and the card that covers it once everyone in the
           kingdom has been helped (game/quest-page.js). -->
      <div class="scene-box">
        <!-- Seashell Beach, drawn big: the sea, a sandy beach and a palm tree
             under the sun, with Mr. Froggles flying over. Same marker style
             as the other kingdoms. It's a group, not one image, so screen
             readers can reach Tilly, Splash and Shelly. Each of their quests
             has its own group (data-quest). -->
        <svg class="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMax slice" role="group" aria-label="Mr. Froggles flying over Seashell Beach, a sunny beach by the sea with a palm tree, a baby sea turtle on the sand, a dolphin in the sea whose beach ball is stuck in the palm tree, and a hermit crab by a tiny pink shell">
          <defs>
            <linearGradient id="beach-sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#9FDBFF" />
              <stop offset="1" stop-color="#FFF1D6" />
            </linearGradient>
            <!-- Little shells lying on the sand: a fan-shaped scallop and a
                 spiral. Each one gets its own color where it's used. -->
            <g id="scallop" stroke="#1F1A24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
              <path d="M-4 6 h8 l-2 5 h-4 Z" />
              <path d="M-14 4 Q-16 -10 0 -14 Q16 -10 14 4 Q7 8 0 6 Q-7 8 -14 4 Z" />
              <path d="M0 5 V-11 M-6 5 L-9 -8 M6 5 L9 -8" fill="none" stroke-width="2" />
            </g>
            <g id="spiral" stroke="#1F1A24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
              <path d="M-14 6 Q-14 -6 0 -12 Q10 -10 15 4 Q2 11 -14 6 Z" />
              <path d="M-5 3 q1 -8 8 -7 q5 3 0 7" fill="none" stroke-width="2" />
            </g>
          </defs>
          <rect width="1200" height="700" fill="url(#beach-sky)" />

          <!-- Tilly's quest. It holds the picture behind everyone too. -->
          <g data-quest="tilly" data-froggles-to="600 250" data-enchant-at="370 520">
            <g stroke="#1F1A24" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
              <!-- Sun -->
              <circle cx="1070" cy="100" r="54" fill="#FFD23F" />
              <path d="M1070 26 V12 M1070 174 V188 M996 100 H982 M1144 100 H1158 M1018 48 l-10 -10 M1122 48 l10 -10 M1018 152 l-10 10 M1122 152 l10 10" fill="none" stroke-width="7" />
              <!-- A cloud -->
              <path d="M820 140 a28 28 0 0 1 46 -20 a36 36 0 0 1 66 10 a26 26 0 0 1 6 48 H830 a24 24 0 0 1 -10 -38 Z" fill="#FFFFFF" />
              <!-- The sea -->
              <path d="M0 300 H1200 V480 Q900 450 600 470 T0 460 Z" fill="#4FA3E0" />
              <path d="M80 340 q30 -12 60 0 M260 380 q30 -12 60 0 M760 330 q30 -12 60 0 M1000 380 q30 -12 60 0 M560 360 q24 -10 48 0" fill="none" stroke="#FFFFFF" stroke-width="6" />
              <!-- The sand, with foam where the sea meets it -->
              <path d="M0 700 V455 Q300 425 600 465 T1200 450 V700 Z" fill="#F6D8A0" />
              <path d="M0 455 Q300 425 600 465 T1200 450" fill="none" stroke="#FFFFFF" stroke-width="10" />
              <!-- A starfish and some pebbles -->
              <path d="M150 620 l8 14 l16 2 l-12 10 l3 16 l-15 -8 l-15 8 l3 -16 l-12 -10 l16 -2 Z" fill="#FF8FB1" stroke-width="4" />
              <circle cx="1080" cy="620" r="9" fill="#C9B7A0" stroke-width="4" />
              <circle cx="1105" cy="634" r="6" fill="#C9B7A0" stroke-width="4" />
            </g>
            <!-- Little shells all over the beach, all too small for Shelly -->
            <use href="#scallop" fill="#FFC9A3" transform="translate(190 540) rotate(-12)" />
            <use href="#spiral" fill="#D9C7F2" transform="translate(280 672)" />
            <use href="#spiral" fill="#FFC9A3" transform="translate(800 610) rotate(-8)" />
            <use href="#scallop" fill="#FFF4E0" transform="translate(1000 520) rotate(-6)" />

            <!-- The wave Mr. Froggles enchants. It rolls up the sand to Tilly,
                 then back out to sea. -->
            <g class="big-wave" stroke="#1F1A24" stroke-linejoin="round" stroke-linecap="round">
              <path d="M250 446 C262 540 314 600 380 598 C446 596 482 540 492 450 Z" fill="#4FA3E0" />
              <path d="M250 446 C262 540 314 600 380 598 C446 596 482 540 492 450" fill="none" stroke-width="7" />
              <path d="M276 540 q16 12 32 4 q16 14 34 8 q18 12 38 6 q18 10 34 -4 q16 4 28 -12" fill="none" stroke="#FFFFFF" stroke-width="7" />
              <path d="M310 490 q20 -9 40 0 M400 506 q20 -9 40 0" fill="none" stroke="#FFFFFF" stroke-width="6" />
            </g>

            <path class="enchant-swirl fades" d="M370 452 C480 452 490 640 370 640 C260 640 250 468 352 462" fill="none" stroke="#5B2A9E" stroke-width="12" stroke-linecap="round" />

            <!-- Little ripples once Tilly is swimming. -->
            <path class="tilly-ripples" d="M210 420 q20 -9 40 0 M354 424 q20 -9 40 0" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

            <!-- Tilly rides the wave out into the sea at the end. -->
            <g class="tilly-swim">
              <!-- Tilly the sea turtle, who needs help. Works like a button
                   (quest-page.js). -->
              <g class="helper" role="button" tabindex="0" aria-label="Tilly the sea turtle needs help. Tap to talk." transform="translate(360 610) scale(1.3)">
                <circle class="helper-ring" cx="4" cy="-4" r="50" fill="none" stroke="none" stroke-width="4" />
                <g stroke="#1F1A24" stroke-width="4" stroke-linejoin="round">
                  <ellipse cx="-22" cy="14" rx="11" ry="6" fill="#7CC36E" transform="rotate(20 -22 14)" />
                  <ellipse cx="20" cy="14" rx="11" ry="6" fill="#7CC36E" transform="rotate(-20 20 14)" />
                  <path d="M-28 4 l-12 4 l10 4 Z" fill="#7CC36E" />
                  <circle cx="34" cy="-6" r="13" fill="#7CC36E" />
                  <ellipse rx="29" ry="20" fill="#3E8E41" />
                  <path d="M-14 -12 l8 9 l14 -1 l6 9 M-6 -3 l-8 13 M8 -4 l6 -12" fill="none" stroke="#2E6B30" stroke-width="3" />
                </g>
                <circle cx="38" cy="-9" r="2.8" fill="#1F1A24" />
                <path d="M36 -1 q4 3 9 0" fill="none" stroke="#1F1A24" stroke-width="2.5" stroke-linecap="round" />
                <g class="alert">
                  <circle cx="4" cy="-52" r="17" fill="#FFFFFF" stroke="#1F1A24" stroke-width="4" />
                  <path d="M4 -62 V-50" stroke="#1F1A24" stroke-width="5" stroke-linecap="round" />
                  <circle cx="4" cy="-42" r="2.8" fill="#1F1A24" />
                </g>
                <circle cx="4" cy="-4" r="46" fill="transparent" />
              </g>
            </g>
          </g>

          <!-- Splash's quest: a dolphin whose beach ball is stuck up in the
               palm tree. Once it's enchanted, the palm tree swings and tosses
               the ball back to her, and she balances it on her nose. -->
          <g data-quest="splash" data-froggles-to="520 220" data-enchant-at="700 280">
            <g class="palm-toss" stroke="#1F1A24" stroke-width="8" stroke-linejoin="round">
              <path d="M712 570 Q700 420 668 268 L690 264 Q726 420 742 570 Z" fill="#A9733F" />
              <path d="M680 262 q-80 -40 -150 10 q70 -10 150 -10 Z M680 262 q-40 -70 -120 -80 q70 30 120 80 Z M680 262 q40 -80 130 -70 q-80 20 -130 70 Z M680 262 q90 -20 140 40 q-70 -30 -140 -40 Z" fill="#3FA34D" />
            </g>

            <path class="enchant-swirl fades" d="M700 180 C820 180 830 380 700 380 C580 380 570 196 682 190" fill="none" stroke="#5B2A9E" stroke-width="12" stroke-linecap="round" />

            <!-- Splash jumps for joy at the end, with the ball on her nose. -->
            <g class="splash-jump">
              <!-- Splash the dolphin, who needs help. Works like a button
                   (quest-page.js). -->
              <g class="helper" role="button" tabindex="0" aria-label="Splash the dolphin needs help. Tap to talk." transform="translate(860 400) scale(1.3)">
                <circle class="helper-ring" cx="4" cy="-14" r="56" fill="none" stroke="none" stroke-width="4" />
                <g stroke="#1F1A24" stroke-width="4" stroke-linejoin="round">
                  <path d="M-6 -27 L4 -46 L14 -26 Z" fill="#7FA9D6" />
                  <path d="M-50 10 Q-40 -30 10 -28 Q40 -26 52 -6 L62 -2 L50 4 Q30 14 -20 12 L-36 26 L-38 12 Z" fill="#7FA9D6" />
                  <path d="M-20 4 Q10 10 40 2" fill="none" stroke="#B9D3EE" stroke-width="5" stroke-linecap="round" />
                </g>
                <circle cx="34" cy="-12" r="3" fill="#1F1A24" />
                <path d="M40 -2 q8 4 14 -2" fill="none" stroke="#1F1A24" stroke-width="2.5" stroke-linecap="round" />
                <g class="alert">
                  <circle cx="10" cy="-80" r="17" fill="#FFFFFF" stroke="#1F1A24" stroke-width="4" />
                  <path d="M10 -90 V-78" stroke="#1F1A24" stroke-width="5" stroke-linecap="round" />
                  <circle cx="10" cy="-70" r="2.8" fill="#1F1A24" />
                </g>
                <circle cx="4" cy="-14" r="52" fill="transparent" />
              </g>
              <!-- The beach ball, stuck in the palm tree. Once it's tossed it
                   flies over in an arc (sideways steadily, up then down) and
                   lands on Splash's nose. -->
              <g class="ball-across">
                <g class="ball-arc">
                  <g transform="translate(706 250)" stroke="#1F1A24" stroke-width="4">
                    <circle r="24" fill="#FFFFFF" />
                    <path d="M0 -24 A24 24 0 0 1 24 0 L0 0 Z" fill="#E5383B" />
                    <path d="M0 24 A24 24 0 0 1 -24 0 L0 0 Z" fill="#4FA3E0" />
                    <path d="M24 0 A24 24 0 0 1 0 24 L0 0 Z" fill="#FFD23F" />
                  </g>
                </g>
              </g>
            </g>
            <!-- The water in front of Splash -->
            <path d="M790 424 q30 -12 60 0 q30 12 60 0" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
          </g>

          <!-- Shelly's quest: a hermit crab who's too big for her shell, by a
               tiny pink shell. Once it's enchanted, it grows into a big swirly
               shell on her back, and she dances side to side. -->
          <g data-quest="shelly" data-froggles-to="400 300" data-enchant-at="615 640">
            <g class="little-shell" stroke="#1F1A24" stroke-width="4" stroke-linejoin="round" transform="translate(615 648)">
              <path d="M-14 6 Q-16 -16 0 -18 Q16 -16 14 6 Z" fill="#FFE3EC" />
              <path d="M-7 4 Q-7 -9 0 -10 Q7 -9 7 4" fill="none" stroke="#FF8FB1" stroke-width="3" />
            </g>

            <path class="enchant-swirl fades" d="M615 580 C700 580 708 714 615 714 C530 714 522 592 600 588" fill="none" stroke="#5B2A9E" stroke-width="12" stroke-linecap="round" />

            <!-- Shelly dances side to side at the end. -->
            <g class="shelly-dance">
              <!-- Shelly the hermit crab, who needs help. Works like a button
                   (quest-page.js). -->
              <g class="helper" role="button" tabindex="0" aria-label="Shelly the hermit crab needs help. Tap to talk." transform="translate(500 630) scale(1.3)">
                <circle class="helper-ring" cy="-12" r="50" fill="none" stroke="none" stroke-width="4" />
                <!-- Her new shell, behind her -->
                <g class="big-shell" stroke="#1F1A24" stroke-width="4" stroke-linejoin="round">
                  <path d="M-34 6 Q-38 -46 0 -50 Q38 -46 34 6 Z" fill="#FFE3EC" />
                  <path d="M-20 2 Q-20 -32 0 -34 Q20 -32 20 2 M-9 0 Q-9 -18 0 -19 Q9 -18 9 0" fill="none" stroke="#FF8FB1" stroke-width="3.5" />
                </g>
                <!-- Her old shell, much too small -->
                <path class="tiny-shell" d="M-9 -4 Q-9 -22 0 -22 Q9 -22 9 -4 Z" fill="#C9B7A0" stroke="#1F1A24" stroke-width="4" stroke-linejoin="round" />
                <g stroke="#1F1A24" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
                  <path d="M-20 14 l-12 8 M-14 16 l-6 12 M20 14 l12 8 M14 16 l6 12" fill="none" />
                  <ellipse cy="6" rx="24" ry="14" fill="#F2734B" />
                  <path d="M-22 0 q-18 -14 -8 -24 q6 8 14 6 M22 0 q18 -14 8 -24 q-6 8 -14 6" fill="#F2734B" />
                  <path d="M-8 -6 L-13 -18 M8 -6 L13 -18" fill="none" />
                </g>
                <circle cx="-14" cy="-21" r="5" fill="#FFFFFF" stroke="#1F1A24" stroke-width="2.5" />
                <circle cx="14" cy="-21" r="5" fill="#FFFFFF" stroke="#1F1A24" stroke-width="2.5" />
                <circle cx="-14" cy="-21" r="2.2" fill="#1F1A24" />
                <circle cx="14" cy="-21" r="2.2" fill="#1F1A24" />
                <path d="M-6 8 q6 5 12 0" fill="none" stroke="#1F1A24" stroke-width="2.5" stroke-linecap="round" />
                <g class="alert">
                  <circle cx="0" cy="-68" r="17" fill="#FFFFFF" stroke="#1F1A24" stroke-width="4" />
                  <path d="M0 -78 V-66" stroke="#1F1A24" stroke-width="5" stroke-linecap="round" />
                  <circle cx="0" cy="-58" r="2.8" fill="#1F1A24" />
                </g>
                <circle cy="-12" r="46" fill="transparent" />
              </g>
            </g>
          </g>

          <!-- Mr. Froggles, flying -->
          <!-- Once everyone is helped, he twirls and flies off. -->
          <g class="froggles-exit">
            <!-- The outer group swoops him over to cast each enchantment. -->
            <g class="froggles-swoop">
              <image class="froggles-flying" href="./mr-froggles.svg" x="300" y="80" width="250" height="325" />
            </g>
          </g>
        </svg>

        <section class="finale" role="dialog" aria-labelledby="finale-title" hidden>
          <div class="finale-card">
            <h2 id="finale-title">You did it!</h2>
            <p>Everyone at Seashell Beach is happy again. Mr. Froggles has flown off to find more friends who need help.</p>
            <div class="finale-buttons">
              <a class="story-button finale-next" href="./next.html">Pick another kingdom</a>
              <button type="button" class="story-button finale-stay">Stay and look</button>
            </div>
          </div>
        </section>
      </div>

      <section class="story" aria-live="polite">
        <p class="story-speaker" hidden></p>
        <p class="story-text"></p>
        <button type="button" class="story-button enchant" hidden></button>
      </section>
    </main>

    <script type="module">
      import { start } from './game/beach-page.js';
      start(document);
    </script>
  </body>
</html>
